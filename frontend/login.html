<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kelatos</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --kelatos-primary: #1768ea;
      --kelatos-secondary: #3633e1;
      --kelatos-text: #373a3c;
      --kelatos-bg: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, var(--kelatos-primary) 0%, var(--kelatos-secondary) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      max-width: 450px;
      width: 100%;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      text-align: center;
    }

    .logo {
      max-width: 200px;
      margin-bottom: 30px;
    }

    .login-title {
      color: var(--kelatos-text);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .login-subtitle {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .btn-google {
      background: var(--kelatos-primary);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      width: 100%;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-google:hover {
      background: var(--kelatos-secondary);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(23, 104, 234, 0.3);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .btn-google i {
      font-size: 20px;
    }

    .loading {
      display: none;
      margin-top: 20px;
    }

    .loading.show {
      display: block;
    }

    .spinner-border {
      width: 2rem;
      height: 2rem;
      color: var(--kelatos-primary);
    }

    .footer {
      margin-top: 30px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
    }

    .footer a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .error-message {
      display: none;
      background: #dc3545;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Logo -->
      <img src="<?= KELATOS.logo ?>" alt="Kelatos" class="logo">

      <!-- Título -->
      <h1 class="login-title">Sistema de Reparaciones</h1>
      <p class="login-subtitle">Ingresa con tu cuenta de Google</p>

      <!-- Botón de Login -->
      <button id="btnLogin" class="btn-google" onclick="iniciarSesion()">
        <i class="fab fa-google"></i>
        <span>Entrar con Google</span>
      </button>

      <!-- Loading -->
      <div id="loading" class="loading">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2" style="color: #6c757d;">Iniciando sesión...</p>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText"></span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer text-center">
      <p class="mb-1">
        <i class="fas fa-map-marker-alt"></i>
        <?= KELATOS.direccion ?>
      </p>
      <p class="mb-1">
        <i class="fas fa-phone"></i>
        <?= KELATOS.telefono ?>
      </p>
      <p>
        <a href="<?= KELATOS.web ?>" target="_blank">
          <i class="fas fa-globe"></i>
          www.kelatos.com
        </a>
      </p>
    </div>
  </div>

  <script>
    /**
     * Inicia el proceso de autenticación
     */
    function iniciarSesion() {
      const btnLogin = document.getElementById('btnLogin');
      const loading = document.getElementById('loading');
      const errorMessage = document.getElementById('errorMessage');

      // Mostrar loading
      btnLogin.style.display = 'none';
      loading.classList.add('show');
      errorMessage.classList.remove('show');

      // Llamar al backend
      google.script.run
        .withSuccessHandler(onLoginSuccess)
        .withFailureHandler(onLoginError)
        .obtenerUsuarioGoogle();
    }

    /**
     * Callback de éxito
     */
    function onLoginSuccess(resultado) {
      if (resultado.exito) {
        // Guardar usuario en localStorage
        localStorage.setItem('kelatos_usuario', JSON.stringify(resultado.usuario));

        // Redirigir al dashboard
        window.location.href = '?page=dashboard';
      } else {
        mostrarError(resultado.error || 'Error al iniciar sesión');
      }
    }

    /**
     * Callback de error
     */
    function onLoginError(error) {
      mostrarError(error.message || 'Error de conexión');
    }

    /**
     * Muestra un mensaje de error
     */
    function mostrarError(mensaje) {
      const btnLogin = document.getElementById('btnLogin');
      const loading = document.getElementById('loading');
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');

      // Ocultar loading
      loading.classList.remove('show');
      btnLogin.style.display = 'flex';

      // Mostrar error
      errorText.textContent = mensaje;
      errorMessage.classList.add('show');

      // Ocultar error después de 5 segundos
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 5000);
    }

    /**
     * Verificar si ya hay sesión activa
     */
    window.onload = function() {
      console.log('🔵 Login page loaded');

      try {
        const usuario = localStorage.getItem('kelatos_usuario');
        console.log('🔵 Usuario en localStorage:', usuario);

        if (usuario) {
          // Validar que el objeto es válido
          const usuarioObj = JSON.parse(usuario);
          console.log('🔵 Usuario parseado:', usuarioObj);

          if (usuarioObj && usuarioObj.email) {
            console.log('✅ Sesión válida encontrada, redirigiendo al dashboard...');
            // Pequeño delay para que se vea el mensaje
            setTimeout(() => {
              window.location.href = '?page=dashboard';
            }, 500);
          } else {
            console.log('⚠️ Sesión inválida, limpiando localStorage');
            localStorage.removeItem('kelatos_usuario');
          }
        } else {
          console.log('ℹ️ No hay sesión activa, mostrando login');
        }
      } catch (error) {
        console.error('❌ Error al verificar sesión:', error);
        // Limpiar localStorage si hay datos corruptos
        localStorage.removeItem('kelatos_usuario');
        alert('Se detectaron datos corruptos. Por favor, inicia sesión nuevamente.');
      }
    };
  </script>
</body>
</html>
